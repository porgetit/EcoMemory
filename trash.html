<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoMemory - Trash</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <style>
        /* ── Tarjeta de papelera ── */
        .trash-card {
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            background: #111;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .trash-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        .trash-canvas-wrapper {
            width: 100%;
            height: 190px;
            position: relative;
        }

        .trash-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Overlay de hover con botones Restore / Delete */
        .trash-card-overlay {
            position: absolute;
            inset: 0;
            background: rgba(26, 15, 10, 0.72);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            opacity: 0;
            transition: opacity 0.2s;
            backdrop-filter: blur(3px);
        }

        .trash-card:hover .trash-card-overlay {
            opacity: 1;
        }

        .btn-overlay-restore,
        .btn-overlay-purge {
            font-size: 0.78rem;
            font-weight: 600;
            padding: 7px 14px;
            border-radius: 7px;
            border: 1px solid;
            cursor: pointer;
            transition: transform 0.15s, background 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn-overlay-restore:hover,
        .btn-overlay-purge:hover {
            transform: scale(1.05);
        }

        .btn-overlay-restore {
            background: rgba(232, 98, 26, 0.2);
            border-color: var(--accent-primary);
            color: var(--accent-primary);
        }

        .btn-overlay-restore:hover {
            background: rgba(232, 98, 26, 0.4);
        }

        .btn-overlay-purge {
            background: rgba(220, 53, 69, 0.15);
            border-color: rgba(220, 53, 69, 0.6);
            color: #f87171;
        }

        .btn-overlay-purge:hover {
            background: rgba(220, 53, 69, 0.35);
        }

        /* Badge de tiempo restante */
        .badge-time {
            position: absolute;
            bottom: 8px;
            left: 8px;
            font-size: 0.72rem;
            font-weight: 600;
            padding: 4px 9px;
            border-radius: 20px;
            background: rgba(26, 15, 10, 0.82);
            color: #fff;
            display: flex;
            align-items: center;
            gap: 5px;
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255,255,255,0.08);
            pointer-events: none;
        }

        .badge-time i { font-size: 0.7rem; opacity: 0.8; }
        .badge-time.urgent  { color: #f87171; }
        .badge-time.warning { color: #fb923c; }
        .badge-time.safe    { color: #86efac; }

        /* Barra de advertencia */
        .trash-alert {
            background: rgba(232, 98, 26, 0.1);
            border: 1px solid rgba(232, 98, 26, 0.3);
            border-radius: 8px;
            padding: 8px 14px;
            font-size: 0.82rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .trash-alert i { color: var(--accent-primary); flex-shrink: 0; }

        /* Botones globales */
        .btn-restore-all {
            background: transparent;
            border: 1px solid var(--accent-primary);
            color: var(--accent-primary);
            font-weight: 600;
            font-size: 0.85rem;
            padding: 8px 18px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 7px;
            transition: background 0.2s, transform 0.15s;
            cursor: pointer;
        }

        .btn-restore-all:hover {
            background: rgba(232, 98, 26, 0.12);
            transform: translateY(-1px);
        }

        .btn-empty-trash {
            background: var(--accent-primary);
            border: none;
            color: #fff;
            font-weight: 600;
            font-size: 0.85rem;
            padding: 8px 18px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 7px;
            transition: background 0.2s, transform 0.15s;
            cursor: pointer;
        }

        .btn-empty-trash:hover {
            background: #d15615;
            transform: translateY(-1px);
        }

        /* Estado vacío */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 380px;
            color: var(--text-secondary);
            gap: 14px;
        }

        .empty-state i {
            font-size: 3.5rem;
            opacity: 0.25;
        }

        .empty-state .empty-title {
            font-size: 1rem;
            font-weight: 600;
            margin: 0;
        }

        .empty-state .empty-sub {
            font-size: 0.82rem;
            opacity: 0.6;
            margin: 0;
        }
    </style>
</head>

<body>
    <!-- Navbar Superior -->
    <nav class="navbar navbar-expand navbar-dark navbar-custom sticky-top d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-2">
            <button class="btn btn-link text-white d-md-none p-0 me-2" type="button"
                data-bs-toggle="offcanvas" data-bs-target="#sidebarOffcanvas">
                <i class="bi bi-list fs-4"></i>
            </button>
            <div class="eco-logo-sm"><img src="./assets/logo.svg" alt="logo"></div>
            <h4 class="mb-0 fs-5">
                <span class="brand-eco">Eco</span><span class="brand-memory">Memory</span>
            </h4>
        </div>
        <div class="d-flex align-items-center gap-3">
            <span class="text-muted-custom d-none d-sm-inline">Welcome back,
                <span class="brand-memory user-name-display">User</span>
            </span>
            <button class="btn btn-sm px-3" id="btnLogout"
                style="background-color: var(--accent-primary); border: none; color: white; font-weight: 600;">
                Logout
            </button>
            <div class="rounded-circle border border-secondary d-flex justify-content-center align-items-center"
                style="width:35px; height:35px;">
                <i class="bi bi-person text-secondary"></i>
            </div>
        </div>
    </nav>

    <!-- Área principal — sin sidebar -->
    <main class="p-4">

        <!-- Cabecera con título y botones globales -->
        <div class="d-flex align-items-start justify-content-between flex-wrap gap-3 mb-3">
            <div>
                <h2 class="fw-bold mb-2">Recently Deleted</h2>
                <div class="trash-alert">
                    <i class="bi bi-info-circle-fill"></i>
                    Items will be permanently deleted after 30 days to optimize your ecological footprint.
                </div>
            </div>
            <div class="d-flex gap-2 align-items-center" id="trashActions">
                <button class="btn-restore-all" id="btnRestoreAll">
                    <i class="bi bi-arrow-counterclockwise"></i> Restore All
                </button>
                <button class="btn-empty-trash" id="btnEmptyTrash">
                    <i class="bi bi-trash3-fill"></i> Empty Trash
                </button>
            </div>
        </div>

        <!-- Grid de papelera -->
        <div class="row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-lg-5 row-cols-xl-6 g-3 mt-1"
            id="trashGrid">
            <!-- Tarjetas renderizadas vía trash.js -->
        </div>

        <!-- Estado vacío -->
        <div class="empty-state d-none" id="emptyState">
            <i class="bi bi-trash3"></i>
            <p class="empty-title">The trash is empty</p>
            <p class="empty-sub">Photos deleted from your gallery will appear here</p>
        </div>

    </main>

    <!-- FAB para volver a galería -->
    <div class="fab-container">
        <button class="btn btn-fab-secondary" id="btnBackToGallery" title="Back to Gallery">
            <i class="bi bi-images fs-5"></i>
        </button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/trash.js"></script>
</body>

</html>
